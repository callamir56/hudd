        <button id="radio-close" class="radio-close" type="button" aria-label="Close radio">✕</button>

        <div class="radio-art" aria-hidden="true">
            <svg viewBox="0 0 512 512"><path d="M499.1 6.3c8.1 6 12.9 15.6 12.9 25.7v72V368c0 44.2-43 80-96 80s-96-35.8-96-80 43-80 96-80c11.2 0 22 1.9 32 5.5V104L192 160v264c0 44.2-43 80-96 80s-96-35.8-96-80 43-80 96-80c11.2 0 22 1.9 32 5.5V96c0-10.1 4.8-19.7 12.9-25.7l304-112c8.2-3 17.5-1.7 24.6 3.6z"/></svg>
        </div>

        <div class="radio-meta">
            <div id="radio-now" class="radio-now">Standby</div>
            <div id="radio-sub" class="radio-sub">Choose a station</div>
        </div>

        <div class="radio-progress-wrap">
            <input id="radio-progress" class="radio-progress" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
            <div class="radio-times" aria-hidden="true">
                <span id="radio-current-time">0:00</span>
                <span id="radio-duration">LIVE</span>
            </div>
        </div>

        <div class="radio-controls">
            <button id="radio-shuffle" class="radio-ctl radio-ctl--line" type="button" aria-label="Shuffle" aria-pressed="false" title="Shuffle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h4l10-12h4"/><path d="m18 2 4 4-4 4"/><path d="M2 6h4l2.5 3"/><path d="M13.5 15 16 18h4"/><path d="m18 14 4 4-4 4"/></svg>
            </button>
            <button id="radio-prev" class="radio-ctl" type="button" aria-label="Previous track" title="Previous track">
                <svg viewBox="0 0 24 24"><path d="M7 5h2.4v14H7zM21 5.8v12.4L10.8 12z"/></svg>
            </button>
            <button id="radio-play" class="radio-ctl radio-ctl--main" type="button" aria-label="Play or pause" title="Play / Pause">
                <svg class="radio-icon-play" viewBox="0 0 24 24"><path d="M8 5.14v13.72L19 12z"/></svg>
                <svg class="radio-icon-pause" viewBox="0 0 24 24"><path d="M6.5 5h3.8v14H6.5zM13.7 5h3.8v14h-3.8z"/></svg>
            </button>
            <button id="radio-next" class="radio-ctl" type="button" aria-label="Next track" title="Next track">
                <svg viewBox="0 0 24 24"><path d="M14.6 5H17v14h-2.4zM3 5.8v12.4L13.2 12z"/></svg>
            </button>
            <button id="radio-repeat" class="radio-ctl radio-ctl--line" type="button" aria-label="Repeat" aria-pressed="false" title="Repeat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
            </button>
        </div>

        <div id="radio-list" class="radio-list" aria-label="Stations"></div>

        <div class="radio-foot">
            <svg class="radio-vol-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <input id="radio-volume" class="radio-volume" type="range" min="0" max="100" value="55" aria-label="Volume">
            <span id="radio-vol-num">55</span>
        </div>
        <audio id="radio-audio" preload="none"></audio>
    </section>

    <audio id="seatbelt-audio" src="m.mp3" preload="auto" loop></audio>

    <div id="status-hud" class="status-hud" aria-hidden="true">
        <div class="status-item status-item--health" data-status="health">
            <div class="status-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.15 10.55 19.83C5.4 15.16 2 12.08 2 8.3 2 5.22 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.08C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.22 22 8.3c0 3.78-3.4 6.86-8.55 11.54L12 21.15Z"></path></svg>
            </div>
            <div class="status-track" role="progressbar" aria-label="Health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div class="status-fill"></div></div>
        </div>

        <div class="status-item status-item--water" data-status="water">
            <div class="status-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.4S5.4 9.75 5.4 14.45A6.6 6.6 0 0 0 12 21.05a6.6 6.6 0 0 0 6.6-6.6C18.6 9.75 12 2.4 12 2.4Zm0 15.9a3.8 3.8 0 0 1-3.8-3.8c0-.55.18-1.27.52-2.08.45 2.17 2.14 3.85 4.31 4.28A3.76 3.76 0 0 1 12 18.3Z"></path></svg>
            </div>
            <div class="status-track" role="progressbar" aria-label="Water" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div class="status-fill"></div></div>
        </div>

        <div class="status-item status-item--food" data-status="food">
            <div class="status-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.2 2v7.05c0 .82-.45 1.55-1.12 1.94V22H3.92V10.99A2.25 2.25 0 0 1 2.8 9.05V2h1.4v5.3h.82V2h1.36v5.3h.82V2h1.4Zm9.25 0c2.02 0 3.65 2.58 3.65 5.75 0 2.2-.78 4.1-1.94 5.07V22H16V12.82c-1.16-.97-1.94-2.87-1.94-5.07C14.06 4.58 14.43 2 16.45 2Z"></path></svg>
            </div>
            <div class="status-track" role="progressbar" aria-label="Food" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div class="status-fill"></div></div>
        </div>

        <div class="status-item status-item--stamina" data-status="stamina">
            <div class="status-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.45 5.2a2.1 2.1 0 1 0 0-4.2 2.1 2.1 0 0 0 0 4.2ZM10.2 22l1.1-5.25 2.2 2.05V22h2.25v-4.15l-2.35-2.3.65-3.2a8.25 8.25 0 0 0 4.95 1.7V11.8a5.55 5.55 0 0 1-4.1-1.72l-1.1-1.22a2.2 2.2 0 0 0-1.67-.76c-.34 0-.65.08-.94.22L5.4 11.7v5.1h2.2v-3.82l1.95-1.08-1.7 8.98L10.2 22Z"></path></svg>
            </div>
            <div class="status-track" role="progressbar" aria-label="Stamina" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div class="status-fill"></div></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
